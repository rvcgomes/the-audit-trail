<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Link builder</title>
<style>
:root{--paper:#E8EEF1;--ink:#15263A;--muted:#566777;--rule:#C6D5DE;--pencil:#C2372C;--card:#F4F7F9}
@media (prefers-color-scheme:dark){:root{--paper:#122130;--ink:#E6EDF2;--muted:#93A5B4;--rule:#22364A;--pencil:#F0685B;--card:#172A3B}}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:1.5rem;margin:0 0 .25rem}
p{color:var(--muted);margin:0 0 1.5rem}
label{display:block;font-weight:600;margin:1rem 0 .35rem}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
small{color:var(--muted)}
output{display:block;word-break:break-all;margin-top:1.5rem;padding:12px;border:1px dashed var(--rule);border-radius:6px;background:var(--card)}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
button,a.b{font:inherit;padding:10px 16px;border-radius:6px;border:1px solid var(--pencil);background:var(--pencil);color:#fff;cursor:pointer;text-decoration:none}
a.b{background:none;color:var(--pencil)}
</style>
</head>
<body>
<main>
  <h1>Link for one application</h1>
  <p>Each company gets its own URL. Nothing is stored anywhere; the name and the text live in the link itself.</p>
  <label for="co">Company</label>
  <input id="co" maxlength="60" placeholder="Acme" autocomplete="off">
  <label for="why">Why this company <small>(1–3 sentences, optional)</small></label>
  <textarea id="why" maxlength="600"></textarea>
  <small id="n">0 / 600</small>
  <output id="out"></output>
  <div class="row"><button type="button" id="copy">Copy link</button><a class="b" id="open" target="_blank" rel="noopener">Open</a></div>
</main>
<script>
var base = new URL("./", location.href).href;
function build(){
  var q = new URLSearchParams(), co = document.getElementById("co").value.trim(), why = document.getElementById("why").value.trim();
  if (co) q.set("co", co);
  if (why) q.set("why", why);
  var url = base + (q.toString() ? "?" + q : "");
  document.getElementById("out").textContent = url;
  document.getElementById("open").href = url;
  document.getElementById("n").textContent = why.length + " / 600";
  return url;
}
["co","why"].forEach(function(id){document.getElementById(id).addEventListener("input",build)});
document.getElementById("copy").onclick = function(){
  var b = this, url = build();
  navigator.clipboard.writeText(url).then(function(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy link"},1500)});
};
build();
</script>
</body>
</html>
